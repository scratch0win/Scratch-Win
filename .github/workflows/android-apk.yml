name: Build Scratch Win User and Admin APKs

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android-app/**'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Android SDK command-line tools
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: latest
          packages: platform-tools
      - name: Install Android platform and build tools
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build separate User and Admin APKs
        working-directory: android-app
        run: gradle --no-daemon assembleUserDebug assembleAdminDebug
      - name: Prepare APK files
        run: |
          mkdir -p release-apks
          cp android-app/app/build/outputs/apk/user/debug/app-user-debug.apk release-apks/Scratch-Win-User.apk
          cp android-app/app/build/outputs/apk/admin/debug/app-admin-debug.apk release-apks/Scratch-Win-Admin.apk
      - name: Publish separate APK downloads
        uses: softprops/action-gh-release@v2
        with:
          tag_name: scratch-win-android-v1.1
          name: Scratch Win Android v1.1 - User and Admin
          files: |
            release-apks/Scratch-Win-User.apk
            release-apks/Scratch-Win-Admin.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
